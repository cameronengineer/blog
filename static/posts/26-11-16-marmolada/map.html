<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marmolada · Recorded route in 3D</title>
<link rel="stylesheet" href="/assets/vendor/maplibre-gl.css">
<style>
:root{color-scheme:light;--bg:#f7f4ec;--ink:#243d32;--muted:#626c62;--line:#d9ded2;--green:#2f5948}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,sans-serif}button,input{font:inherit}button{background:#fffefa;color:var(--green);border:1px solid #a5afa2;border-radius:4px;padding:7px 12px;cursor:pointer}button:hover,button[aria-pressed="true"]{background:var(--green);color:white}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #946a2f;outline-offset:3px}header{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font:24px Georgia,serif;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:11px}.controls{display:flex;gap:6px;flex-wrap:wrap}.map-wrap{position:relative;height:440px;border-block:1px solid var(--line);background:#e9eee5}#map{position:absolute;inset:0}#fallback{position:absolute;inset:0;background:var(--bg);z-index:1}#fallback img{width:100%;height:100%;object-fit:contain}.legend{position:absolute;left:12px;top:12px;background:#fffefae8;padding:6px 10px;border-radius:4px;z-index:2;pointer-events:none;font-size:11px}.legend span{color:#946a2f;margin-left:10px}.profile{padding:12px 18px 15px}.profile img{display:block;width:100%;height:145px;object-fit:fill}.slider-row{display:flex;gap:16px;align-items:center;justify-content:space-between;font-size:11px;margin-bottom:5px}.slider-row output{font-variant-numeric:tabular-nums}input[type="range"]{width:100%;accent-color:var(--green);margin:4px 0;cursor:pointer}.hint{font-size:11px;color:var(--muted);margin:6px 0 0}.maplibregl-ctrl-attrib{font-size:10px!important}.maplibregl-popup-content{font:12px/1.5 system-ui,sans-serif;color:var(--ink)}[hidden]{display:none!important}
@media(max-width:500px){header{align-items:flex-start;padding:12px;gap:10px;flex-direction:column}.map-wrap{height:370px}.profile{padding:10px 12px}.profile img{height:130px}.legend{font-size:10px}.slider-row{gap:8px}}
</style>
<script src="/assets/vendor/maplibre-gl.js" defer></script>
<script src="map.js" defer></script>
</head>
<body>
<header><div><h1>Marmolada</h1><p>9 August 2026 · 22.4 km · ↑ 1,887 m</p></div><div class="controls" aria-label="Map views"><button id="view3d" aria-pressed="true" disabled>3D terrain</button><button id="view2d" aria-pressed="false" disabled>Overhead</button><button id="reset" disabled>Reset view</button></div></header>
<div class="map-wrap"><div id="map" aria-label="Interactive map of the recorded Marmolada route"></div><div id="fallback"><img src="route.svg" alt="Recorded route starting near Penìa and climbing to the highest point on Punta Penia, then returning."></div><div class="legend">● Start / finish <span>● Highest point</span></div></div>
<section class="profile" aria-label="Recorded elevation profile">
<div class="slider-row"><label for="distance">Explore the route</label><output id="readout" for="distance" aria-live="off">0.0 km · 1,508 m</output></div>
<input id="distance" type="range" min="0" max="1" value="0" step="1" aria-label="Position along the route" disabled>
<img src="elevation.svg" alt="Elevation rises from about 1,500 metres to 3,349 metres, before descending to the start across a 22.4 kilometre route.">
<p class="hint" id="status" role="status">Loading the interactive map. The recorded route and elevation profile are shown above.</p>
<noscript><p class="hint">JavaScript is needed for the interactive map. The route outline and elevation profile remain available.</p></noscript>
</section>
</body>
</html>
